[project]
name = "stepfunction"
version = "0.1.0"
authors = [{ name = "Vineeth Penugonda" }]
description = "Step Function Workflow Orchestration Library"
readme = "README.md"
keywords = ["StepFunction", "Workflow", "Orchestration", "Library"]
requires-python = ">=3.9"
dependencies = []
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Topic :: Software Development :: Libraries"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["stepfunction.*"]

[project.urls]
Homepage = "https://github.com/vinecodes/stepfunction"
Issues = "https://github.com/vinecodes/stepfunction/issues"
Blog_Post = "https://blog.vineethp.com/posts/introducingstepfunction/"
